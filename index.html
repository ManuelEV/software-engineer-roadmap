    />

    <script>
      try {
        // Study progress is no longer kept: clear what older versions saved.
        ;['apuntes:progress', 'apuntes:last', 'anden:progress', 'anden:last', 'anden:theme', 'anden:codetab'].forEach(function (k) {
          localStorage.removeItem(k)
        })
        // Dark is the default; apply a chosen light theme before first paint.
        if (localStorage.getItem('apuntes:theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
